<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stargaze - Editar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Editar Publicación</h1>
            <a href="/dashboard" class="btn btn-secondary">Volver</a>
        </div>
        
        <div class="auth-box" style="max-width: 500px; margin: 0 auto;">
            {% with messages = get_flashed_messages(category_filter=['obs']) %}
                {% if messages %}
                    {% for message in messages %}<div class="error-msg">{{ message }}</div>{% endfor %}
                {% endif %}
            {% endwith %}
            <form action="/update_observation/{{ obs.id }}" method="POST">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" name="name" value="{{ obs.name }}">
                </div>
                <div class="form-group">
                    <label>Fecha:</label>
                    <input type="date" name="date" value="{{ obs.date }}">
                </div>
                <div class="form-group">
                    <label>Lugar:</label>
                    <input type="text" name="location" value="{{ obs.location }}">
                </div>
                <div class="form-group">
                    <label>Descripción:</label>
                    <textarea name="description" rows="5">{{ obs.description }}</textarea>
                </div>
                <div style="text-align: right;">
                    <button type="submit" class="btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
